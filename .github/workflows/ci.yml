name: CI - Python et stack réelle
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: python -m unittest discover -s tests -v
      - run: python scripts/demo_failures.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journaux-python-${{ matrix.python }}
          path: docs/evidence/*.log
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: docker compose config --quiet
      - run: docker compose up -d postgres s3
      - run: docker compose build pipeline
      - run: docker compose run --rm pipeline demo --source s3 --db-failures 2 --s3-failures 2
      - run: docker compose run --rm pipeline run --source s3
      - name: Vérifier les valeurs en PostgreSQL
        run: docker compose run --rm --entrypoint python pipeline -c 'from datapipeline.database import Database; import os; r=Database(os.environ["DATABASE_URL"]).report(); assert (r["files"],r["transactions"],r["flagged"],r["total_cents"]) == (3,18,6,4920003),r; print(r)'
      - run: docker compose exec -T postgres createdb -U pipeline ci_test
      - run: docker compose run --rm -e TEST_POSTGRES_URL=postgresql://pipeline:tp-db-change-me@postgres:5432/ci_test --entrypoint python pipeline -m unittest tests.test_pipeline.RealPostgresTests -v
      - name: Tests S3 réel
        env:
          TEST_S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: tpaccess
          S3_SECRET_KEY: tpsecret-change-me
        run: python -m unittest tests.test_s3.RealS3Tests -v
      - name: OCR réel en conteneur
        run: docker compose run --rm pipeline ocr --input examples/transaction.png
      - name: Journaux Docker
        if: always()
        run: docker compose logs --no-color > docker.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journaux-docker
          path: docker.log
      - if: always()
        run: docker compose down -v
